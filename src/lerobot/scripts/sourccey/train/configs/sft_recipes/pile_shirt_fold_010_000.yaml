# Teach the c-010 base model to retrieve shirts from a pile and fold them,
# while replaying an equal share of the general folding demonstrations to
# preserve the existing folding behavior.
policy:
  path: outputs/sft/xvla_s_sourccey-shirt-fold-c-010-pre-000/checkpoints/500000/pretrained_model
  push_to_hub: false
  # The new demonstrations teach visual/action behavior using language the
  # pretrained Florence encoder already understands.
  freeze_language_encoder: true
  # Two GPUs process a global batch of 16 for 250k updates, retaining the
  # four-million-sample budget of 500k updates at global batch 8.
  scheduler_warmup_steps: 5000
  scheduler_decay_steps: 250000
  scheduler_decay_lr: 5e-06

dataset:
  normalization: checkpoint
  # Keep every frame while excluding out-of-episode future action positions
  # from XVLA's loss.
  mask_padded_actions: true
  sources:
    - repo_id: Combination/sourccey-shirt-fold-c-010
      weight: 0.50
    - repo_id: Combination/sourccey-pile-shirt-fold-a-001
      weight: 0.50

# Use the XVLA policy preset's full learning rate for new-task acquisition.
policy_preset_lr_scale: 1.0
output_dir: outputs/sft/xvla_s_sourccey-pile-shirt-fold-010-000
job_name: xvla_s_sourccey-pile-shirt-fold-010-000
# Batch size is per process: 8 x 2 distributed workers = global batch 16.
steps: 250000
batch_size: 8
num_workers: 4
eval_freq: 0
save_freq: 25000
log_freq: 200

wandb:
  enable: true
