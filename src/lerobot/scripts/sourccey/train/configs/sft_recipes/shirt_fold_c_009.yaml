# Preserve the general shirt-folding behavior learned by 009 while replaying
# every local corner-case dataset currently present in the SFT collection.
policy:
  path: outputs/train/xvla_s_sourccey-shirt-fold-c-009/checkpoints/1000000/pretrained_model
  push_to_hub: false
  # These corrections teach visual/action behavior, not new language.
  freeze_language_encoder: true
  # Span the entire 500k-step SFT run explicitly. scheduler_decay_lr is the
  # XVLA preset-scale floor; after policy_preset_lr_scale=0.5, the actual
  # head floor is 2.5e-6 and the trainable VLM floor is 2.5e-7.
  scheduler_warmup_steps: 5000
  scheduler_decay_steps: 500000
  scheduler_decay_lr: 5e-06

dataset:
  normalization: checkpoint
  # Keep every frame while excluding out-of-episode future action positions
  # from XVLA's loss.
  mask_padded_actions: true
  sources:
    # Most updates remain anchored to the demonstrations that produced 009.
    - repo_id: Combination/sourccey-shirt-fold-c-009
      weight: 0.70

    # Every dataset in either SFT collection is loaded as one logical source.
    # The 0.30 share is divided by child frame count, not equally by folder.
    - repo_id: local/sourccey-013-shirt-fold-c-sft-corrections
      root: /home/sourccey/.cache/huggingface/lerobot/sourccey-013/nickm
      subdataset_glob: "sourccey-013__shirt-fold-c-sft-00[01]/*"
      weight: 0.30

# 5e-5 for the XVLA policy head/soft prompts and 5e-6 for its VLM group.
policy_preset_lr_scale: 0.5
output_dir: outputs/sft/xvla_s_sourccey-shirt-fold-c-009-corners-006
job_name: xvla_s_sourccey-shirt-fold-c-009-corners-006
steps: 500000
batch_size: 8
num_workers: 4
eval_freq: 0
save_freq: 50000
log_freq: 200

wandb:
  enable: true
