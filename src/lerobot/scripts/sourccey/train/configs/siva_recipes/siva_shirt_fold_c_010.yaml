# Train SIVA on C-010 from the converted C-009 XVLA checkpoint.
policy:
  path: outputs/converted/xvla_s_sourccey-shirt-fold-c-009-to-siva
  dtype: bfloat16
  device: cuda
  push_to_hub: false
  input_features: null
  scheduler_warmup_steps: 10000
  scheduler_decay_steps: 1000000
  scheduler_decay_lr: 5.0e-06

  # Optional: switch this to true to cache the frozen Florence output after its
  # first use. Put the SQLite file on fast local NVMe, not a network filesystem.
  cache_florence_features: true
  florence_cache_path: outputs/cache/siva_shirt_fold_c_010/florence_features.sqlite

dataset:
  repo_id: Combination/sourccey-shirt-fold-c-010
  root: /home/sourccey/.cache/huggingface/lerobot/Combination/sourccey-shirt-fold-c-010
  # Required for cache correctness: a dataset index must always produce the
  # same pixels. Leave random image augmentation disabled when caching.
  image_transforms:
    enable: false

output_dir: outputs/train/siva_sourccey-shirt-fold-c-010
job_name: siva_sourccey-shirt-fold-c-010
steps: 1000000
save_freq: 50000
batch_size: 8

wandb:
  enable: false
