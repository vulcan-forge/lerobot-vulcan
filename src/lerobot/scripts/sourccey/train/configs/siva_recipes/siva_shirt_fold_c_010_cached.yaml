# Train SIVA on C-010 with a frozen Florence feature cache.
policy:
  path: outputs/converted/xvla_s_sourccey-shirt-fold-c-009-to-siva
  dtype: bfloat16
  device: cuda
  push_to_hub: false
  input_features: null
  scheduler_warmup_steps: 10000
  scheduler_decay_steps: 1000000
  scheduler_decay_lr: 5.0e-06

  # Recovery experiment: prioritize direct action imitation over fitting an
  # averaged motion prior, and use a finer flow solve during rollout.
  endpoint_loss_weight: 1.0
  prior_loss_weight: 0.05
  num_denoising_steps: 10
  n_action_steps: 4

  # Cached features are valid only while Florence and its inputs are fixed.
  freeze_vlm: true
  cache_florence_features: true
  florence_cache_path: outputs/cache/siva_shirt_fold_c_010/florence_features.sqlite

dataset:
  repo_id: Combination/sourccey-shirt-fold-c-010
  root: /home/sourccey/.cache/huggingface/lerobot/Combination/sourccey-shirt-fold-c-010
  # Cache rows are keyed by dataset index, so each index must produce stable pixels.
  image_transforms:
    enable: false

output_dir: outputs/train/siva_sourccey-shirt-fold-c-010-cached-recovery-001
job_name: siva_sourccey-shirt-fold-c-010-cached-recovery-001
steps: 1000000
save_freq: 100000
batch_size: 8

wandb:
  enable: false
